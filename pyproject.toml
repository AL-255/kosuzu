[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kosuzu-inventory"
version = "0.3.1"
description = "Collaborative electronics inventory backed by GitHub pull requests"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Kosuzu contributors"}]
dependencies = []

[project.scripts]
kosuzu = "kosuzu.cli:main"

[tool.setuptools.packages.find]
include = ["kosuzu*"]

[tool.setuptools.package-data]
kosuzu = ["web/*", "catalog_assets/*"]
