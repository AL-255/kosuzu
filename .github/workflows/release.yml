name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build==1.6.1
      - name: Verify tag matches package version
        run: python -c "import os; from kosuzu import __version__; assert os.environ.get('GITHUB_REF_TYPE') != 'tag' or os.environ['GITHUB_REF_NAME'] == 'v' + __version__, 'Tag does not match package version'"
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: kosuzu --version
      - uses: actions/upload-artifact@v4
        with:
          name: source-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-15-intel
            label: macos-x86_64
          - os: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . pyinstaller==6.22.3 certifi==2026.6.17
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_distribution.py --platform-label ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            dist/kosuzu-*.zip
            dist/kosuzu-*.tar.gz
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . playwright==1.63.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python -m tests.browser_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source, desktop, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*packages'
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "Kosuzu $GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag
