name: Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: kosuzu --version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check kosuzu/web/app.js
      - run: node --check kosuzu/catalog_assets/app.js
      - run: node tests/catalog_search.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . playwright==1.63.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python -m tests.browser_smoke
      - run: python -m tests.catalog_browser_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
